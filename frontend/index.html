<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/frieght_iq_logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FreightIQ Intelligent Freight Forecasting & Vessel Chartering Optimization Platform — Real-time analytics for bulk cargo procurement to India's East Coast" />
    <title>FreightIQ — Freight Intelligence Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isLocal =
            location.hostname === 'localhost' ||
            location.hostname === '127.0.0.1';
          if (isLocal) {
            // Unregister any leftover SW so Vite HMR / fresh modules stay fast
            navigator.serviceWorker.getRegistrations().then((regs) => {
              regs.forEach((reg) => reg.unregister());
            });
            if (window.caches) {
              caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
            }
            return;
          }
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
